{% extends "shoppingService/shoppingService_base.html" %}

{% block title %}add product{% endblock %}

{% block content %}
<!--basic form submission here-->
<div class="container">
    <h3>Add Product</h3>
    <form method="POST" action="/add_product">
        <!-- input for product name -->
        <div class="mb-3">
            <label for="product_name" class="form-label">Enter product name</label>
            <input type="text" class="form-control" id="product_name" name="product_name" required>
        </div>
         <!-- Category Dropdown -->
         <div class="mb-3">
            <label for="category" class="form-label">Product Category</label>
            <select 
                class="form-select" 
                id="category" 
                name="category" 
                required>
                <!-- Hard codes for all the product categories in order to match our database -->
                <option value="" disabled selected>Select Product Type</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Food">Food</option>
                <option value="Furniture">Furniture</option>
                <option value="Sports & Equipment">Sports/Equipment</option>
                <option value="Toys & Games">Toys/Games</option>
                <option value="Books">Books</option>
                <option value="Arts & Crafts">Arts/Craft</option>
                <option value="Personal Care">Personal Care</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <!-- input for the price of the product -->
        <div class="mb-3">
            <label for="price" class="form-label">Price: </label>
            <input type="text" class="form-control" id="price" name="price" required>
            <span class="ms-2">$</span>
        </div>
        <!-- submit button to confirm inputed information -->
        <button type="submit" class="btn btn-primary">Add Product</button>
    </form>
</div>
{% endblock %}
