<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}shoppingService{% endblock %}</title>
    <style>

    /* navbar styles */
    html, body {
        margin: 0;
        padding: 0;
    }

    .nav_bar {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #333;
        width: 100%;
    }

    li {
        float: left;
    }

    li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }  

    li a:hover:not(.active) {
        background-color: #111;
    }

    .active {
    background-color: #6BADCE;
    }

    /* about page styles */

    /* styles for the inspo section */
    .aboutHeader{
        padding-top: 20px;
        text-align: center;
    }

    .inspo{
        display: flex;
        justify-content: center;
        padding-top: 100px;
    }

    .inspoBox{
        display: block;
        justify-content: center;
        width: 40rem;
        height: 15rem;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        outline: none;
        margin-bottom: 20px;
    }

    .inspoHeader{
        text-align: center;
        max-width: 0 0 10px 0;
        font-size: 24px;
        font-weight: bold;
    }
    
    .inspoText{
        text-align: center;
        margin: 20px;
        font-size: 16px;
    }

    /* styles for the team section */
    .team{
        width: 100%;
        padding-top: 100px;
        text-align: center;
    }

    .teamHeader {
    margin-bottom: 20px; /* Space below the header */
    font-size: 28px; /* Adjust size as needed */
    font-weight: bold; /* Make it stand out */
    }

    .teamRow1{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 20%;
        margin-right: 20%;
    }

    .teamRow2{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 30%;
        margin-right: 30%;
    }

    .teamMemeberBox{
        display: inline-block;
        justify-content: center;
        width: 20rem;
        height: 20rem;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        outline: none;
        margin-bottom: 20px;
    }

    /* styles for the tech stack section */
    .techStack{
        width: 100%;
        padding-top: 100px;
        text-align: center;
    }

    .techHeader{
        margin-bottom: 20px; /* Space below the header */
        font-size: 28px; /* Adjust size as needed */
        font-weight: bold; /* Make it stand out */
    }

    .techRow1{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 20%;
        margin-right: 20%;
    }

    .techRow2{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 20%;
        margin-right: 20%;
    }

    .techBox{
        display: inline-block;
        justify-content: center;
        width: 20rem;
        height: 20rem;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        outline: none;
        margin-bottom: 20px;
    }


    /* search page styles */

    /* search header */
    .searchHeader{
        text-align: center;
        margin-bottom: 20px; /* Space below the header */
        font-size: 18px; /* Adjust size as needed */
        font-weight: bold; /* Make it stand out */
    }

    /* styles for the toggle button */
    .toggle-contianer{
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 15px;
    }

    .toggleSwitchcontianer{
        position: absolute;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        width: fit-content;
        border: 3px solid #343434;
        border-radius: 20px;
        background: #343434;
        font-weight: bold;
        color: #343434;
        cursor: pointer;
    }
    .toggleSwitchcontianer::before{
        content: '';
        position: absolute;
        width: 50%;
        height: 100%;
        left: 0%;
        border-radius:20px;
        background: white;
        transition: all 0.3s;
    }

    .toggleCheckbox:checked +
    .toggleSwitchcontianer::before{
        left: 50%;
    }

    .toggleSwitchcontianer div{
        padding: 6px;
        text-align: center;
        z-index: 1;
    }

    .toggleCheckbox{
        display: none;   
    }

    .toggleCheckbox:checked +
    .toggleSwitchcontianer div:first-child{
        color: white;
        transition: color 0.3s;
    }

    .toggleCheckbox:checked + 
    .toggleSwitchcontianer div:last-child{
        color: #343434;
        transition: color 0.3s;
    }

    .toggleCheckbox + 
    .toggleSwitchcontianer div:first-child{
        color: #343434;
        transition: color 0.3s;
    }

    .toggleCheckbox + 
    .toggleSwitchcontianer div:last-child{
        color: white;
        transition: color 0.3s;
    }

    </style>
</head>

<body>
    <!--Nav Bar-->
    <ul class="nav_bar">
        <li><a href="/home" class="{% if current_page == 'home' %}active{% endif %}">Home</a></li>
        <li><a href="/search"class="{% if current_page == 'search' %}active{% endif %}" >Search</a></li>

        {% if account_type == 'business' %}
            <li><a href="/add_promotions" class="{% if current_page == 'add_promotions' %}active{% endif %}">Add Promotions</a></li>
            <li><a href="/add_product" class="{% if current_page == 'add_product' %}active{% endif %}">Add Product</a></li>
            <li><a href="/add_store" class="{% if current_page == 'add_store' %}active{% endif %}">Add Store</a></li>
        {% endif %}

        <li><a href="/about" class="{% if current_page == 'about' %}active{% endif %}">About</a></li>
        <li style="float: right;"><a href="/profile" class="{% if current_page == 'profile' %}active{% endif %}">Profile</a></li>
        
    </ul>

    {% block content %}
    <!-- Content from child templates will be injected here -->
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
    
</html>
