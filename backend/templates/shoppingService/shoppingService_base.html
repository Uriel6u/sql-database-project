<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}shoppingService{% endblock %}</title>
    <style>

    /* navbar styles */
    html, body {
        margin: 0;
        padding: 0;
    }

    .nav_bar {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #333;
        width: 100%;
    }

    li {
        float: left;
    }

    li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }  

    li a:hover:not(.active) {
        background-color: #111;
    }

    .active {
    background-color: #6BADCE;
    }

    /* about page styles */

    /* styles for the inspo section */
    .aboutHeader{
        padding-top: 20px;
        text-align: center;
    }

    .inspo{
        display: flex;
        justify-content: center;
        padding-top: 100px;
    }

    .inspoBox{
        display: block;
        justify-content: center;
        width: 40rem;
        height: 15rem;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        outline: none;
        margin-bottom: 20px;
    }

    .inspoHeader{
        text-align: center;
        max-width: 0 0 10px 0;
        font-size: 24px;
        font-weight: bold;
    }
    
    .inspoText{
        text-align: center;
        margin: 20px;
        font-size: 16px;
    }

    /* styles for the team section */
    .team{
        width: 100%;
        padding-top: 100px;
        text-align: center;
    }

    .teamHeader {
    margin-bottom: 20px; /* Space below the header */
    font-size: 28px; /* Adjust size as needed */
    font-weight: bold; /* Make it stand out */
    }

    .teamRow1{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 20%;
        margin-right: 20%;
    }

    .teamRow2{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 30%;
        margin-right: 30%;
    }

    .teamMemeberBox{
        display: inline-block;
        justify-content: center;
        width: 20rem;
        height: 20rem;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        outline: none;
        margin-bottom: 20px;
    }

    /* styles for the tech stack section */
    .techStack{
        width: 100%;
        padding-top: 100px;
        text-align: center;
    }

    .techHeader{
        margin-bottom: 20px; /* Space below the header */
        font-size: 28px; /* Adjust size as needed */
        font-weight: bold; /* Make it stand out */
    }

    .techRow1{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 20%;
        margin-right: 20%;
    }

    .techRow2{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 20%;
        margin-right: 20%;
    }

    .techBox{
        display: inline-block;
        justify-content: center;
        width: 20rem;
        height: 20rem;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        outline: none;
        margin-bottom: 20px;
    }


    /* search page styles */

    /* search header */
    .searchHeader{
        text-align: center;
        margin-bottom: 20px; /* Space below the header */
        font-size: 18px; /* Adjust size as needed */
        font-weight: bold; /* Make it stand out */
    }

    /* styles for the toggle button */
    .toggle-contianer{
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 15px;
    }

    .toggleSwitchcontianer{
        position: absolute;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        width: fit-content;
        border: 3px solid #343434;
        border-radius: 20px;
        background: #343434;
        font-weight: bold;
        color: #343434;
        cursor: pointer;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
    }
    .toggleSwitchcontianer::before{
        content: '';
        position: absolute;
        width: 50%;
        height: 100%;
        left: 0%;
        border-radius:20px;
        background: white;
        transition: all 0.3s;
    }

    .toggleCheckbox:checked +
    .toggleSwitchcontianer::before{
        left: 50%;
    }

    .toggleSwitchcontianer div{
        padding: 6px;
        text-align: center;
        z-index: 1;
    }

    .toggleCheckbox{
        display: none;   
    }

    .toggleCheckbox:checked +
    .toggleSwitchcontianer div:first-child{
        color: white;
        transition: color 0.3s;
    }

    .toggleCheckbox:checked + 
    .toggleSwitchcontianer div:last-child{
        color: #343434;
        transition: color 0.3s;
    }

    .toggleCheckbox + 
    .toggleSwitchcontianer div:first-child{
        color: #343434;
        transition: color 0.3s;
    }

    .toggleCheckbox + 
    .toggleSwitchcontianer div:last-child{
        color: white;
        transition: color 0.3s;
    }

    /* styles for search by store page */
    .storenameInputContainer{
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 70px;
    }

    .storeSearch{
        border-radius: 20px;
        border: 1px solid #111;
        height: 30px;
        width: 400px
    }

    .storeDropDownFilterContainer{
        display: flex;
        justify-content: space-between;
        gap: 3%;
        margin-left: 35%;
        margin-right: 35%;
        padding-top: 40px;
    }

    .storeTypeDropdown{
        width: 150px;
        height: 30px;
        border-radius: 14px;
    }

    /* styles for search by promotions */

    .discountRangeContainer{
        margin-left: 25%;
        margin-right: 25%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 50px;
    }

    .card{
        width: 400px;
        border-radius: 5px;
        padding: 20px;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
    }

    .discountHeader{
        text-align: center;
        margin-bottom: 20px;
    }
    
    .discount-content{
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 10px;
    }

    .discountText{
        font-size: 14px;
        font-weight: 500;
    }

    .discountValue{
        font-size: 16px;
        font-weight: 600;
    }

    .range-slider{
        width: 400px;
        position: relative;
        margin: 15px 0 30px 0;
    }

    .range-fill{
        height: 6px;
        position: absolute;
        background-color: #6BADCE;
        z-index: 1;
    }

    input[type="range"]{
        width: 100%;
        background: transparent;
        position: absolute;
        left: 0;
    }

    input[type="range"]::-webkit-slider-thumb{
        height: 15px;
        width: 15px;
        border-radius: 50%;
        background-color: #6BADCE;
        cursor: pointer;
        margin-top: -5px;
        position: relative;
        z-index: 1;
    }

    input[type="range"]::-webkit-slider-runnable-track{
        width: 100%;
        height: 5px;
        background: #e8e8e8;
        border-radius: 3px;
        border: none;
    }

    /* drop down filters for discount */
    .discountDropDownFilterContainer{
        display: flex;
        justify-content: space-between;
        gap: 3%;
        margin-left: 35%;
        margin-right: 35%;
        padding-top: 40px;
    }

    .discountTypeDropdown{
        width: 150px;
        height: 30px;
        border-radius: 14px;
    }

    </style>

<style>
    .toggle-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
    }

    .toggleSwitchContainer {
        position: relative;
        width: 60px;
        height: 30px;
        background: #ccc;
        border-radius: 15px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .toggleSwitchContainer input[type="checkbox"] {
        display: none;
    }

    .toggleSwitchContainer span {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 26px;
        height: 26px;
        background: white;
        border-radius: 50%;
        transition: left 0.3s;
    }

    .toggleSwitchContainer input[type="checkbox"]:checked + span {
        left: 32px;
        background: #6BADCE;
    }
</style>
</head>

<body>
    <!--Nav Bar-->
    <ul class="nav_bar">
        <li><a href="/home" class="{% if current_page == 'home' %}active{% endif %}">Home</a></li>
        <li><a href="/search"class="{% if current_page == 'search' %}active{% endif %}" >Search</a></li>

        {% if account_type == 'business' %}
            <li><a href="/add_promotions" class="{% if current_page == 'add_promotions' %}active{% endif %}">Add Promotions</a></li>
            <li><a href="/add_product" class="{% if current_page == 'add_product' %}active{% endif %}">Add Product</a></li>
            <li><a href="/add_store" class="{% if current_page == 'add_store' %}active{% endif %}">Add Store</a></li>
        {% endif %}

        <li><a href="/about" class="{% if current_page == 'about' %}active{% endif %}">About</a></li>
        <li style="float: right;"><a href="/profile" class="{% if current_page == 'profile' %}active{% endif %}">Profile</a></li>
        
    </ul>

    {% block content %}
    <!-- Content from child templates will be injected here -->
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
    
</html>
