<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}shoppingService{% endblock %}</title>
    <style>

    /* navbar styles */
    html, body {
        margin: 0;
        padding: 0;
    }

    .nav_bar {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #333;
        width: 100%;
    }

    li {
        float: left;
    }

    li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }  

    li a:hover:not(.active) {
        background-color: #111;
    }

    .active {
    background-color: #6BADCE;
    }

    /* about page styles */

    /* styles for the inspo section */
    .aboutHeader{
        padding-top: 20px;
        text-align: center;
    }

    .inspo{
        display: flex;
        justify-content: center;
        padding-top: 100px;
    }

    .inspoBox{
        display: block;
        justify-content: center;
        width: 40rem;
        height: 15rem;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        outline: none;
        margin-bottom: 20px;
    }

    .inspoHeader{
        text-align: center;
        max-width: 0 0 10px 0;
        font-size: 24px;
        font-weight: bold;
    }
    
    .inspoText{
        text-align: center;
        margin: 20px;
        font-size: 16px;
    }

    /* styles for the team section */
    .team{
        width: 100%;
        padding-top: 100px;
        text-align: center;
    }

    .teamHeader {
    margin-bottom: 20px; /* Space below the header */
    font-size: 28px; /* Adjust size as needed */
    font-weight: bold; /* Make it stand out */
    }

    .teamRow1{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 20%;
        margin-right: 20%;
    }

    .teamRow2{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 30%;
        margin-right: 30%;
    }

    .teamMemeberBox{
        display: inline-block;
        justify-content: center;
        width: 20rem;
        height: 20rem;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        outline: none;
        margin-bottom: 20px;
    }

    /* styles for the yech stack section */
    .techStack{
        width: 100%;
        padding-top: 100px;
        text-align: center;
    }

    .techHeader{
        margin-bottom: 20px; /* Space below the header */
        font-size: 28px; /* Adjust size as needed */
        font-weight: bold; /* Make it stand out */
    }

    .techRow1{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 20%;
        margin-right: 20%;
    }

    .techRow2{
        display: flex;
        justify-content: space-between;
        gap: 10%;
        margin-left: 20%;
        margin-right: 20%;
    }

    .techBox{
        display: inline-block;
        justify-content: center;
        width: 20rem;
        height: 20rem;
        box-shadow: 4px 6px 30px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        outline: none;
        margin-bottom: 20px;
    }

    </style>
</head>

<body>
    <!--Nav Bar-->
    <ul class="nav_bar">
        <li><a href="/home" class="{% if current_page == 'home' %}active{% endif %}">Home</a></li>
        <li><a href="/search"class="{% if current_page == 'search' %}active{% endif %}" >Search</a></li>
        <li><a href="/about" class="{% if current_page == 'about' %}active{% endif %}">About</a></li>
        <li style="float: right;"><a href="/profile" class="{% if current_page == 'profile' %}active{% endif %}">Profile</a></li>
        
    </ul>

    {% block content %}
    <!-- Content from child templates will be injected here -->
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
    
</html>
