{% extends "shoppingService/shoppingService_base.html" %}

{% block title %}add store{% endblock %}

{% block content %}
<!--basic gpt form submission here-->
<div class="container">
    <h3>Add Store</h3>
    <form method="POST" action="/add_store">
        <div class="mb-3">
            <label for="store_name" class="form-label">Store/company Name</label>
            <input type="text" class="form-control" id="store_name" name="store_name" required>
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" name="location" required>
        </div>
        <div class="mb-3">
            <label for="contact_info" class="form-label">Contact Number</label>
            <input type="text" class="form-control" id="contact_info" name="contact_info" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Store</button>
    </form>
</div>
{% endblock %}
