{% extends "userAuth/auth_base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-sm-10 col-12"> <!-- Responsive column width for various screen sizes -->
        <h3 class="text-center">MyShopping Registration</h3>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">

            <div class="mb-3">
                <label for="registerName" class="form-label">Name</label>
                <input type="text" class="form-control w-100" id="registerName" name="name" placeholder="Enter Name" required>
            </div>

            <div class="mb-3">
                <label for="registerUsername" class="form-label">Username</label>
                <input type="text" class="form-control w-100" id="registerUsername" name="username" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label for="registerEmail" class="form-label">Email</label>
                <input type="email" class="form-control w-100" id="registerEmail" name="email" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label for="registerPassword" class="form-label">Password</label>
                <input type="password" class="form-control w-100" id="registerPassword" name="password" placeholder="Enter password" required>
            </div>

            <div class="mb-3">
                <label for="registerCity" class="form-label">City</label>
                <input type="text" class="form-control w-100" id="registerCity" name="city" placeholder="Enter city" required>
            </div>

            <div class="mb-3">
                <label for="registerState" class="form-label">State</label>
                <input type="text" class="form-control w-100" id="registerState" name="state" placeholder="Enter state" required>
            </div>

            <!-- add drop down for account type-->
            <label for="account_type">Account Type:</label>
            <select name="account_type" id="account_type" required>
                <option value="user">User</option>
                <option value="business">Business</option>
            </select>

            <button type="submit" class="btn btn-success w-100">Register</button>

            <div class="text-center mt-3">
                <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
