<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Authentication{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Flex container to split the screen */
        .split-container {
            display: flex;
            min-height: 100vh;
        }

        /* Left section (Form) - 1 part */
        .form-section {
            flex: 1; /* Left side takes up 1 part */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #f8f9fa; /* Light background for contrast */
        }

        /* Right section (Image) - 2 parts */
        .image-section {
            flex: 2; /* Right side takes up 2 parts */
            background-image: url("{{ url_for('static', filename='images/authBackground.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Form styling */
        .auth-form {
            width: 100%;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.9); /* White background with slight transparency */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
            
    </style>
</head>
<body>
    <div class="split-container">
        <!-- Left Section (Form) -->
        <div class="form-section">
            <div class="auth-form">
                {% block content %}{% endblock %}
            </div>
        </div>

        <!-- Right Section (Image) -->
        <div class="image-section"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
